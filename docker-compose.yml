version: "3.8"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: drivewise-postgres
    environment:
      POSTGRES_DB: drivewise
      POSTGRES_USER: drivewise
      POSTGRES_PASSWORD: drivewise_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drivewise -d drivewise"]
      interval: 10s
      timeout: 5s
      retries: 5

  # DriveWise Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: drivewise-app
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://drivewise:drivewise_password@postgres:5432/drivewise
      - SESSION_SECRET=your-super-secret-session-key-change-in-production
      - REPL_ID=local-development
      - REPLIT_DOMAINS=localhost:5000
      - ISSUER_URL=https://replit.com/oidc
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:5000/api/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Redis for Session Storage (optional, can use PostgreSQL sessions)
  redis:
    image: redis:7-alpine
    container_name: drivewise-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  default:
    name: drivewise-network
